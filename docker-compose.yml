version: '3.8'

services:
  zari-whatsapp:
    build: .
    container_name: zari-whatsapp-server
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://evo.infispark.in}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-vR39h6avY69g7kAU3YQbS6V6XEvudson}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-vR39h6avY69g7kAU3YQbS6V6XEvudson}
      - INSTANCE_NAME=${INSTANCE_NAME:-zari}
      - CATALOGUE_URL=${CATALOGUE_URL:-https://wa.me/c/919423185940}
      - AUTO_READ_MESSAGES=${AUTO_READ_MESSAGES:-true}
      - REPLY_DELAY_MS=${REPLY_DELAY_MS:-1000}
    env_file:
      - .env
